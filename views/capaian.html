<div class="glass-card p-6 rounded-2xl space-y-6">
    <div class="flex flex-col md:flex-row justify-between items-center gap-4 border-b border-slate-700/60 pb-4">
        <h2 class="text-lg font-bold text-white flex items-center gap-2">
            <i data-lucide="award" class="w-5 h-5 text-amber-400"></i> Input Capaian Nilai & Cetak Rapor SMP
        </h2>
        
        <div class="flex flex-wrap items-center gap-3">
            <div class="flex items-center gap-2 bg-slate-900/80 p-2 rounded-xl border border-slate-700">
                <span class="text-xs text-slate-400 font-medium">Filter Kelas:</span>
                <select id="filter-kelas-nilai" onchange="setKelasFilter(this.value)" class="px-2 py-1 rounded bg-slate-900 border border-slate-700 text-white text-xs font-bold">
                    <option value="SEMUA">Semua Kelas (VII-IX)</option>
                    <option value="VII">Kelas VII</option>
                    <option value="VIII">Kelas VIII</option>
                    <option value="IX">Kelas IX</option>
                </select>
            </div>

            <div class="flex items-center gap-2 bg-blue-900/40 p-2 rounded-xl border border-blue-500/30">
                <span class="text-xs text-blue-300 font-medium">Pilih Siswa:</span>
                <select id="siswa-select" onchange="changeSiswaIndex(this.value)" class="px-3 py-1 rounded bg-slate-900 border border-slate-700 text-white text-xs font-bold">
                    <!-- Options diisi dinamis JS -->
                </select>
            </div>
        </div>
    </div>

    <div class="p-4 bg-slate-900/90 rounded-2xl border border-blue-500/30 flex flex-col md:flex-row justify-between items-center gap-4">
        <div>
            <p class="text-xs font-bold text-blue-400 flex items-center gap-2">
                <i data-lucide="file-spreadsheet" class="w-4 h-4"></i> Form Pengisian Nilai Kolektif SMP (Excel/CSV)
            </p>
            <p class="text-[11px] text-slate-400 mt-0.5">Unduh form nilai terpisah per kolom mapel, isi secara manual, lalu upload kembali untuk mengisi nilai otomatis.</p>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="downloadFormNilaiCSV()" class="px-3.5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-xl flex items-center gap-2 shadow-md">
                <i data-lucide="download" class="w-4 h-4"></i> Unduh Form Nilai
            </button>
            <label class="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl flex items-center gap-2 cursor-pointer shadow-md">
                <i data-lucide="upload" class="w-4 h-4"></i> Upload Form Nilai
                <input type="file" id="upload-csv-file" accept=".csv" class="hidden" onchange="uploadFormNilaiCSV(event)">
            </label>
        </div>
    </div>

    <div id="rapor-sheet-editor" class="space-y-6">
        <!-- Editor Rapor Dinamis JS -->
    </div>
</div>
